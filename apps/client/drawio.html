<!doctype html>
<html lang="ko">
  <head><meta charset="UTF-8" /><title>Notryx 다이어그램 기기 초안</title></head>
  <body>
    <header><strong id="save-mode">기기 초안을 편집합니다.</strong>
      <span>편집을 1초 이상 멈추면 이 기기에 초안을 저장합니다.</span>
      <button id="save-server" type="button" disabled hidden>서버에 저장</button>
      <button id="export-png" type="button" disabled>편집 가능한 PNG 내보내기</button>
      <button id="close" type="button">편집 닫기</button>
    </header>
    <p id="status" role="status">편집기를 준비하는 중입니다.</p>
    <p id="server-status" role="status" hidden></p>
    <button id="retry" type="button" hidden>초안 저장 재시도</button>
    <iframe id="diagram" title="draw.io 기기 초안 편집기" sandbox="allow-scripts"></iframe>
    <dialog id="discard"><p>기기에 초안을 저장하고 닫을까요? 추가 서버 저장은 요청하지 않습니다. 이미 요청한 전송은 계속 진행합니다.</p>
      <button id="keep" type="button">계속 편집</button><button id="discard-confirm" type="button">초안 저장 후 닫기</button></dialog>
    <script type="module" src="/src/drawio-editor.ts"></script>
  </body>
</html>
