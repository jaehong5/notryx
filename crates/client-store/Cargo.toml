[package]
name = "notryx-client-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "=1.54.1", features = ["rt", "macros", "time"] }
uuid = { version = "=1.29.0", features = ["v4", "v7"] }
url = "=2.5.8"
sha2 = "=0.11.1"
unicode-normalization = "=0.1.26"
notryx-protocol = { path = "../protocol" }
notryx-domain = { path = "../domain" }
serde_json = "=1.0.154"
tempfile = "=3.27.0"
libsqlite3-sys = "=0.37.0"
