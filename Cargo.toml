[workspace]
resolver = "3"
members = ["crates/domain", "crates/protocol", "crates/client-store", "crates/client-runtime", "crates/server-storage", "apps/server", "apps/client/src-tauri"]
default-members = ["crates/domain", "crates/protocol", "crates/client-store", "crates/server-storage", "apps/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[profile.dev]
debug = 1

[profile.test]
debug = 1
