[package]
name = "notryx-server-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
test-hooks = []

[[bin]]
name = "storage-crash-probe"
path = "src/bin/storage-crash-probe.rs"
required-features = ["test-hooks"]

[dependencies]
notryx-domain = { path = "../domain" }
rustix = { version = "=1.1.5", features = ["fs"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
uuid = { version = "=1.29.0", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
