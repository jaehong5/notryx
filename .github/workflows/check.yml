name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo bash scripts/install-linux-deps.sh
      - run: npm ci
      - run: bash scripts/check.sh
      - run: npm run tauri -- build --debug --bundles deb -- --locked
      - name: Verify Linux package contents
        shell: bash
        run: |
          python3 scripts/check-linux-deb.py target/debug/bundle/deb/*.deb
          dpkg-deb -x target/debug/bundle/deb/*.deb .artifacts/linux-package/extracted
      - run: xvfb-run -a python3 scripts/m0-webdriver.py --output ci-artifacts/webdriver
      - run: xvfb-run -a python3 scripts/m4-mermaid-webdriver.py --output ci-artifacts/mermaid
      - run: xvfb-run -a python3 scripts/m4-theme-webdriver.py --output ci-artifacts/theme
      - run: xvfb-run -a python3 scripts/m5a-mobile-webdriver.py --output ci-artifacts/mobile
      - run: cargo build --locked -p notryx-server
      - run: xvfb-run -a python3 scripts/m2-workspace-webdriver.py --binary .artifacts/linux-package/extracted/usr/bin/notryx-client
      - run: xvfb-run -a python3 scripts/m2-migration-recovery-webdriver.py
      - name: Verify M3 two-client lifecycle
        timeout-minutes: 8
        shell: bash
        run: |
          mkdir -p ci-artifacts
          scripts/m3-secret-no-service.sh xvfb-run -a python3 scripts/m2-workspace-webdriver.py \
            --remote-change reopen --two-client-lifecycle 2>&1 | tee ci-artifacts/m3-lifecycle.log
      - name: Prepare unsigned Linux build metadata
        shell: bash
        run: |
          python3 scripts/prepare-release.py \
            --artifact target/debug/bundle/deb/Notryx_0.1.0_amd64.deb \
            --output ci-artifacts/linux-build --profile linux-debug-ci
      - name: Upload unsigned Linux build
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-debug-unsigned
          path: ci-artifacts/linux-build/
          if-no-files-found: error
          retention-days: 7
      - name: Upload WebDriver failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: webdriver-failure
          path: |
            ci-artifacts/webdriver/
            ci-artifacts/mermaid/
            ci-artifacts/theme/
            ci-artifacts/mobile/
            ci-artifacts/m3-lifecycle.log
          if-no-files-found: ignore
          retention-days: 7
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build server image
        run: docker build -f deploy/Dockerfile --target runtime -t notryx:ci .
      - name: Test server image
        run: python3 scripts/test-docker.py --image notryx:ci --output ci-artifacts/docker-results.json
      - name: Upload Docker test results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: docker-test-results
          path: ci-artifacts/docker-results.json
          if-no-files-found: ignore
          retention-days: 7
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare pinned Android SDK and Rust target
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "platforms;android-36" \
            "build-tools;36.0.0" "ndk;30.0.16248370"
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
          rustup show active-toolchain
      - run: npm ci
      - run: python3 scripts/test-android-apk.py
      - name: Build ARM64 development APK
        run: npm run tauri -- android build --debug --target aarch64 --apk --ci
      - name: Test encrypted credential files
        run: >-
          apps/client/src-tauri/gen/android/gradlew
          -p apps/client/src-tauri/gen/android :app:testArm64DebugUnitTest
          --tests org.notryx.m0.CredentialFilesTest
          --max-workers=1 --no-daemon --console=plain
      - name: Inspect development APK
        run: >-
          python3 scripts/check-android-apk.py
          apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          --build-type debug --output ci-artifacts/android/apk-check.json
      - name: Upload development APK and inspection
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-arm64-debug-development
          path: |
            apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            ci-artifacts/android/apk-check.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload Android test diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: android-test-diagnostics
          path: apps/client/src-tauri/gen/android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
