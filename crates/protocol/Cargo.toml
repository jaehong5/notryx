[package]
name = "notryx-protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
notryx-domain = { path = "../domain" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
schemars = "=1.2.3"
ts-rs = { version = "=12.0.1", default-features = false }
sha2 = "=0.11.1"
base64 = "=0.23.1"
uuid = { version = "=1.29.0", features = ["serde"] }
