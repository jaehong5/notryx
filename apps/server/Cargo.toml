[package]
name = "notryx-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json"] }
base64 = "=0.23.1"
getrandom = "=0.4.3"
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "service"] }
notryx-domain = { path = "../../crates/domain" }
notryx-protocol = { path = "../../crates/protocol" }
notryx-server-storage = { path = "../../crates/server-storage" }
rustix = { version = "=1.1.5", features = ["fs", "process"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
subtle = "=2.6.1"
tokio = { version = "=1.54.1", features = ["rt", "macros", "time", "sync", "net", "signal", "io-util"] }
toml = "=1.1.8"
uuid = { version = "=1.29.0", features = ["v4", "v7", "serde"] }

[dev-dependencies]
notryx-server-storage = { path = "../../crates/server-storage", features = ["test-hooks"] }
tempfile = "=3.27.0"
