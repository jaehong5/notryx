[package]
name = "notryx-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
notryx-domain = { path = "../../crates/domain" }
notryx-server-storage = { path = "../../crates/server-storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
uuid = { version = "=1.29.0", features = ["v4", "v7", "serde"] }

[dev-dependencies]
notryx-server-storage = { path = "../../crates/server-storage", features = ["test-hooks"] }
tokio = { version = "=1.54.1", features = ["rt", "macros", "time"] }
tempfile = "=3.27.0"
