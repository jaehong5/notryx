[package]
name = "notryx-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "notryx_client"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["sync", "time", "rt"] }
notryx-client-store = { path = "../../../crates/client-store" }
notryx-client-runtime = { path = "../../../crates/client-runtime" }
notryx-domain = { path = "../../../crates/domain" }
notryx-protocol = { path = "../../../crates/protocol" }
base64 = "=0.23.1"
uuid = { version = "=1.29.0", features = ["v4", "v7"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "=0.18.2"
tempfile = "=3.27.0"
secret-service = { version = "=5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tempfile = "=3.27.0"
notryx-server = { path = "../../server" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "sqlite"] }
